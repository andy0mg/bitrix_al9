---
- name: Установка окружения 1С-Битрикс «Управление сайтом» на Debian 13
  hosts: bitrix
  become: true

  pre_tasks:
    - name: Проверить, что это Debian 13
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == "Debian"
          - ansible_facts.distribution_major_version == "13"
        fail_msg: "Плейбук рассчитан на Debian 13 (trixie)"

    - name: Сгенерировать пароль БД, если он не задан
      ansible.builtin.set_fact:
        bitrix_db_password: >-
          {{ lookup('ansible.builtin.password',
             bitrix_credentials_dir ~ '/' ~ inventory_hostname ~ '-db_password',
             chars=['ascii_letters', 'digits'], length=24) }}
      when: bitrix_db_password | length == 0
      no_log: true

  tasks:
    - name: ОС и пакеты
      ansible.builtin.import_tasks: tasks/packages.yml
    - name: Архив конфигураций
      ansible.builtin.import_tasks: tasks/config_archive.yml
    - name: PHP
      ansible.builtin.import_tasks: tasks/php.yml
    - name: Apache
      ansible.builtin.import_tasks: tasks/apache.yml
    - name: Nginx
      ansible.builtin.import_tasks: tasks/nginx.yml
    - name: MariaDB
      ansible.builtin.import_tasks: tasks/mariadb.yml
    - name: Redis
      ansible.builtin.import_tasks: tasks/redis.yml
      when: bitrix_install_redis | bool
    - name: Сайт
      ansible.builtin.import_tasks: tasks/site.yml
    - name: Фаервол
      ansible.builtin.import_tasks: tasks/firewall.yml
      when: bitrix_configure_firewall | bool

  handlers:
    - name: Restart apache
      ansible.builtin.systemd:
        name: apache2
        state: restarted
        daemon_reload: true

    - name: Reload nginx
      ansible.builtin.systemd:
        name: nginx
        state: reloaded

    - name: Restart mariadb
      ansible.builtin.systemd:
        name: mariadb
        state: restarted

    - name: Restart exim4
      ansible.builtin.shell: update-exim4.conf && systemctl restart exim4
      changed_when: true

    - name: Restart redis
      ansible.builtin.systemd:
        name: redis-server
        state: restarted
        daemon_reload: true

  post_tasks:
    - name: Применить отложенные перезапуски служб
      ansible.builtin.meta: flush_handlers

    - name: Проверить, что bitrixsetup.php открывается через nginx
      ansible.builtin.uri:
        url: http://127.0.0.1/bitrixsetup.php
        return_content: true
      register: bitrix_check
      failed_when: bitrix_check.status != 200 or 'itrix' not in bitrix_check.content
      when:
        - bitrix_download_setup_script | bool
        - not bitrix_installed.stat.exists

    - name: Итог
      ansible.builtin.debug:
        msg: >-
          Готово. Откройте http://{{ ansible_host | default(inventory_hostname) }}/bitrixsetup.php
          и установите продукт. БД: localhost / {{ bitrix_db_name }} / {{ bitrix_db_user }},
          пароль в {{ bitrix_credentials_dir }}/{{ inventory_hostname }}-db_password
          (если не задан явно).
