---
- name: Скопировать конфиги Nginx
  ansible.builtin.command: rsync -a --itemize-changes {{ bitrix_config_dir }}/nginx/ /etc/nginx/
  register: bitrix_rsync
  changed_when: bitrix_rsync.stdout | length > 0
  notify: Reload nginx

- name: Убрать стандартный сайт Debian (конфликт default_server на 80)
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

- name: Включить сайт default.conf из архива
  ansible.builtin.file:
    src: /etc/nginx/sites-available/default.conf
    dest: /etc/nginx/sites-enabled/default.conf
    state: link
    force: true
  notify: Reload nginx

- name: Отключить rtc.conf (push-сервер не используется в «Управлении сайтом»)
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/rtc.conf
    state: absent
  notify: Reload nginx

- name: Имена push и httpd для upstream-ов в /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "127.0.0.1 push httpd"
    state: present

- name: Проверить конфигурацию Nginx
  ansible.builtin.command: nginx -t
  changed_when: false

- name: Включить и запустить Nginx
  ansible.builtin.systemd:
    name: nginx
    enabled: true
    state: started
