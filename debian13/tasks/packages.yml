---
- name: Обновить кэш apt и систему
  ansible.builtin.apt:
    update_cache: true
    upgrade: "{{ 'dist' if bitrix_upgrade_system | bool else omit }}"
    cache_valid_time: 3600
  register: bitrix_apt_upgrade

- name: Перезагрузить сервер после обновления
  ansible.builtin.reboot:
  when:
    - bitrix_reboot_after_upgrade | bool
    - bitrix_apt_upgrade is changed

- name: Установить служебные утилиты
  ansible.builtin.apt:
    name: [wget, unzip, rsync, python3-pymysql]
    state: present

- name: Проверить версию PHP
  ansible.builtin.assert:
    that: bitrix_php_version | string in bitrix_php_supported_versions
    fail_msg: "bitrix_php_version={{ bitrix_php_version }}; поддерживаются {{ bitrix_php_supported_versions | join(', ') }}"

- name: Репозиторий PHP от sury.org
  when: bitrix_php_version | string != '8.4' or bitrix_php_force_sury | bool
  block:
    - name: Ключ репозитория sury
      ansible.builtin.apt:
        deb: https://packages.sury.org/debsuryorg-archive-keyring.deb
        state: present

    - name: Источник пакетов sury
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/php-sury.list
        content: >
          deb [signed-by=/usr/share/keyrings/debsuryorg-archive-keyring.gpg]
          https://packages.sury.org/php/ {{ ansible_facts.distribution_release }} main
        mode: "0644"
      register: bitrix_sury_repo

# Apache ставим первым, чтобы phpX.Y подтянул libapache2-mod-phpX.Y
- name: Установить Apache
  ansible.builtin.apt:
    name: apache2
    state: present

- name: Установить PHP {{ bitrix_php_version }}
  ansible.builtin.apt:
    name: >-
      {{ bitrix_php_packages + bitrix_php_extra_packages
         + ([] if v is version('8.5', '>=') else ['php' ~ v ~ '-opcache']) }}
    state: present
    # после подключения sury нужен свежий кэш apt
    update_cache: "{{ bitrix_sury_repo is defined and bitrix_sury_repo is changed }}"
  # В PHP 8.5 opcache встроен в ядро, отдельного пакета нет
  vars:
    v: "{{ bitrix_php_version }}"
    bitrix_php_packages:
      - "php{{ v }}"
      - "libapache2-mod-php{{ v }}"
      - "php{{ v }}-cli"
      - "php{{ v }}-common"
      - "php{{ v }}-dev"
      - "php{{ v }}-gd"
      - "php{{ v }}-ldap"
      - "php{{ v }}-mbstring"
      - "php{{ v }}-mysql"
      - "php{{ v }}-pspell"
      - "php{{ v }}-xml"
      - "php{{ v }}-zip"
      - "php{{ v }}-amqp"
      - "php{{ v }}-apcu"
      - php-pear

- name: Выбрать PHP по умолчанию для CLI (cron, агенты) {{ bitrix_php_version }}
  community.general.alternatives:
    name: php
    path: "/usr/bin/php{{ bitrix_php_version }}"

# Остановить Apache до установки nginx: оба по умолчанию слушают 80-й порт
- name: Узнать, перенастроен ли уже Apache на 8090
  ansible.builtin.command: grep -q 'Listen 8090' /etc/apache2/ports.conf
  register: bitrix_apache_ported
  changed_when: false
  failed_when: false

- name: Остановить Apache (порт 80 нужен nginx)
  ansible.builtin.systemd:
    name: apache2
    state: stopped
  when: bitrix_apache_ported.rc != 0

- name: Установить Nginx, MariaDB
  ansible.builtin.apt:
    name: [nginx, mariadb-server, mariadb-common]
    state: present

- name: Установить Redis
  ansible.builtin.apt:
    name: redis-server
    state: present
  when: bitrix_install_redis | bool

- name: Почтовый агент exim4 (internet site)
  when: bitrix_install_mta | bool
  block:
    - name: Ответы debconf для exim4
      ansible.builtin.debconf:
        name: exim4-config
        question: "{{ item.q }}"
        value: "{{ item.v }}"
        vtype: "{{ item.t }}"
      loop:
        - {q: exim4/dc_eximconfig_configtype, v: "internet site; mail is sent and received directly using SMTP", t: select}
        - {q: exim4/mailname, v: "{{ bitrix_mta_hostname }}", t: string}
        - {q: exim4/dc_local_interfaces, v: "127.0.0.1 ; ::1", t: string}

    - name: Установить exim4
      ansible.builtin.apt:
        name: exim4-daemon-light
        state: present

    - name: Режим internet в update-exim4.conf.conf
      ansible.builtin.lineinfile:
        path: /etc/exim4/update-exim4.conf.conf
        regexp: "^dc_eximconfig_configtype="
        line: "dc_eximconfig_configtype='internet'"
      notify: Restart exim4
