# /etc/nginx/sites-available/petlocal.ru.conf
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name petlocal.ru;

    ssl_certificate     /etc/nginx/ssl/petlocal.ru2025.pem;
    ssl_certificate_key /etc/nginx/ssl/petlocal.ru2025.key;
    include conf.d/ssl-params.conf;

    deny all;
}
