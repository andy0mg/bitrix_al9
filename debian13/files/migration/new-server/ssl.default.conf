# /etc/nginx/sites-available/ssl.default.conf
server {
    listen 443 default_server ssl;
    listen [::]:443 default_server ssl;
    http2 on;
    # Основной портал (на старом шёл через default_server s1/ssl.s1)
    server_name petrovichjob.ru www.petrovichjob.ru _;
    server_name_in_redirect off;

    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/cert.key;
    include conf.d/ssl-params.conf;

    access_log /var/log/nginx/access_ssl.log json;
    error_log  /var/log/nginx/error_ssl.log warn;

    proxy_set_header X-Real-IP        $remote_addr;
    proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
    proxy_set_header Host             $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header HTTPS            YES;

    proxy_redirect ~^(http://[^:]+):\d+(/.+)$ $1$2;
    proxy_redirect ~^(https://[^:]+):\d+(/.+)$ $1$2;

    set $docroot "/var/www/html/bx-site";
    index index.php;
    root "/var/www/html/bx-site";

    location = /petlocal/potok/addVacancy.php {
        proxy_pass          https://petlocal.ru/potok/addVacancy.php;
        proxy_redirect      off;
        proxy_http_version  1.1;

        proxy_ssl_server_name on;
        proxy_set_header  Host               petlocal.ru;
        proxy_set_header  Upgrade            $http_upgrade;
        proxy_set_header  Connection         "upgrade";
        proxy_set_header  X-Real-IP          $remote_addr;
        proxy_set_header  X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header  X-Forwarded-Proto  https;
    }

    include conf.d/bx_temp.conf;
    include conf.d/bitrix.conf;
}
