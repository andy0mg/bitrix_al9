# /etc/nginx/sites-available/petrovich.tech.conf
# На новом nginx.conf уже: include sites-available/*.conf;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name petrovich.tech;
    server_name_in_redirect off;

    ssl_certificate     /etc/nginx/ssl/petrovich.tech.pem;
    ssl_certificate_key /etc/nginx/ssl/petrovich.tech.key;
    include conf.d/ssl-params.conf;

    large_client_header_buffers 8 32k;
    client_max_body_size 1000M;

    access_log /var/log/nginx/petrovich.tech_access.log json;
    error_log  /var/log/nginx/petrovich.tech_error.log warn;

    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header Host               $host;
    proxy_set_header X-Forwarded-Host   $host;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_set_header X-Forwarded-Scheme $scheme;

    location ^~ /bitrix/pub/ {
        access_log off;
        proxy_pass http://nodejs_pub;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 43800;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $replace_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~* ^/bitrix/subws/ {
        access_log off;
        proxy_pass http://nodejs_sub;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 43800;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $replace_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~* ^/bitrix/sub/ {
        access_log off;
        rewrite ^/bitrix/sub/(.*)$ /bitrix/subws/$1 break;
        proxy_pass http://nodejs_sub;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 43800;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~* ^/bitrix/rest/ {
        access_log off;
        proxy_pass http://nodejs_pub;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 43800;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://apache/it/;
        proxy_connect_timeout 300;
        proxy_send_timeout 2400;
        proxy_read_timeout 2400;
    }
}

# HTTP для временного proxy со старого (10.21.62.180 → сюда :80)
server {
    listen 80;
    listen [::]:80;
    server_name petrovich.tech;
    server_name_in_redirect off;

    large_client_header_buffers 8 32k;
    client_max_body_size 1000M;

    access_log /var/log/nginx/petrovich.tech_access.log json;
    error_log  /var/log/nginx/petrovich.tech_error.log warn;

    set $fwd_proto $scheme;
    if ($http_x_forwarded_proto != "") {
        set $fwd_proto $http_x_forwarded_proto;
    }

    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header Host               $host;
    proxy_set_header X-Forwarded-Host   $host;
    proxy_set_header X-Forwarded-Proto  $fwd_proto;
    proxy_set_header X-Forwarded-Scheme $fwd_proto;

    location ^~ /bitrix/pub/ {
        access_log off;
        proxy_pass http://nodejs_pub;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 43800;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $replace_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~* ^/bitrix/subws/ {
        access_log off;
        proxy_pass http://nodejs_sub;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 43800;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $replace_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~* ^/bitrix/sub/ {
        access_log off;
        rewrite ^/bitrix/sub/(.*)$ /bitrix/subws/$1 break;
        proxy_pass http://nodejs_sub;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 43800;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~* ^/bitrix/rest/ {
        access_log off;
        proxy_pass http://nodejs_pub;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 43800;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://apache/it/;
        proxy_connect_timeout 300;
        proxy_send_timeout 2400;
        proxy_read_timeout 2400;
    }
}
