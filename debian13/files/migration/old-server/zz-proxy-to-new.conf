# ВРЕМЕННО: старый BitrixEnv (10.21.62.180) → новый Debian (10.254.61.6)
# Замените им содержимое /etc/nginx/bx/site_enabled/petrovich.tech.conf
# (не оставляйте два server_name petrovich.tech).
# Для default-сайта см. s1-proxyserver-snippet.txt.

map $http_upgrade $bx_connection_upgrade {
  default upgrade;
  '' 'close';
}

map $http_upgrade $bx_replace_upgrade {
  default $http_upgrade;
  ''      "websocket";
}

map $http_upgrade $replace_upgrade {
  default $http_upgrade;
  ''      "websocket";
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' 'close';
}

# --- petrovich.tech: HTTPS на новый сервер (без повторного /it/ — его добавит новый) ---
server {
    listen 443 ssl;
    server_name petrovich.tech;
    server_name_in_redirect off;

    ssl_certificate     /etc/nginx/ssl/petrovich.tech.pem;
    ssl_certificate_key /etc/nginx/ssl/petrovich.tech.key;

    large_client_header_buffers 8 32k;
    client_max_body_size 1000M;

    access_log /var/log/nginx/petrovichtech_proxy_to_new.log;
    error_log  /var/log/nginx/petrovichtech_proxy_to_new_error.log warn;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    proxy_connect_timeout 300;
    proxy_send_timeout    2400;
    proxy_read_timeout    2400;

    # Push оставляем локально на старом, если push ещё здесь;
    # иначе закомментируйте эти location и весь /bitrix/* уйдёт на новый.
    location ^~ /bitrix/pub/ {
        access_log off;
        proxy_pass http://pt_pub;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 43800;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $bx_replace_upgrade;
        proxy_set_header Connection $bx_connection_upgrade;
    }

    location ~* ^/bitrix/subws/ {
        access_log off;
        proxy_pass http://pt_sub;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 43800;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $replace_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location ~* ^/bitrix/sub/ {
        access_log off;
        rewrite ^/bitrix/sub/(.*)$ /bitrix/subws/$1 break;
        proxy_pass http://pt_sub;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 43800;
    }

    location ~* ^/bitrix/rest/ {
        access_log off;
        proxy_pass http://pt_pub;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 43800;
    }

    location / {
        # Новый сервер: HTTP:80 (пока проще) с сохранением Host и схемы
        proxy_pass http://10.254.61.6;
        # Когда на новом поднимется 443 с теми же сертификатами:
        # proxy_pass https://10.254.61.6;
        # proxy_ssl_server_name on;
        # proxy_ssl_name petrovich.tech;
    }
}

# --- default HTTPS (ssl.s1): backend на новый ---
# Вариант без правки ssl.s1.conf: отдельный include не переопределит
# default_server. Надёжнее вручную в ssl.s1.conf и s1.conf:
#
#   set $proxyserver "http://10.254.61.6";
#   proxy_set_header Host $host;
#   # убрать суффикс :443 / :80 у Host
#
# И location potok оставить как есть или тоже проксировать на новый.
