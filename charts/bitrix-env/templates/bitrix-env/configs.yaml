apiVersion: v1
stringData:
  .settings.php: |-
    <?php
    return array (
    'pull' => array(
        'value' => array(
          'path_to_listener' => 'http://{{ .Values.fqdn }}/bitrix/sub/',
          'path_to_listener_secure' => 'https://{{ .Values.fqdn }}/bitrix/sub/',
          'path_to_modern_listener' => 'http://{{ .Values.fqdn }}/bitrix/sub/',
          'path_to_modern_listener_secure' => 'https://{{ .Values.fqdn }}/bitrix/sub/',
          'path_to_mobile_listener' => 'http://{{ .Values.fqdn }}:8893/bitrix/sub/',
          'path_to_mobile_listener_secure' => 'https://{{ .Values.fqdn }}:8894/bitrix/sub/',
          'path_to_websocket' => 'ws://{{ .Values.fqdn }}/bitrix/subws/',
          'path_to_websocket_secure' => 'wss://{{ .Values.fqdn }}/bitrix/subws/',
          'path_to_publish' => 'http://{{ .Values.fqdn }}/bitrix/pub/',
          'path_to_publish_web' => 'http://{{ .Values.fqdn }}/bitrix/rest/',
          'path_to_publish_web_secure' => 'https://{{ .Values.fqdn }}/bitrix/rest/',
          'path_to_json_rpc' => 'http://{{ .Values.fqdn }}/bitrix/api/',
          'nginx_version' => '4',
          'nginx_command_per_hit' => '100',
          'nginx' => 'Y',
          'nginx_headers' => 'N',
          'push' => 'Y',
          'websocket' => 'Y',
          'signature_key' => '{{ .Values.push.key }}',
          'signature_algo' => 'sha1',
          'guest' => 'N',
        ),
      ),    
      'cache_flags' =>
      array (
        'value' =>
        array (
          'config_options' => 3600.0,
        ),
        'readonly' => false,
      ),
      'cookies' =>
      array (
        'value' =>
        array (
          'secure' => false,
          'http_only' => true,
        ),
        'readonly' => false,
      ),
      'exception_handling' =>
      array (
        'value' =>
        array (
          'debug' => false,
          'handled_errors_types' => 4437,
          'exception_errors_types' => 4437,
          'ignore_silence' => false,
          'assertion_throws_exception' => true,
          'assertion_error_type' => 256,
          'log' => NULL,
        ),
        'readonly' => false,
      ),
      'connections' =>
      array (
        'value' =>
        array (
          'default' =>
          array (
            'host' => '{{ .Values.mysql.host }}',
            'database' => '{{ .Values.mysql.database }}',
            'login' => '{{ .Values.mysql.login }}',
            'password' => '{{ .Values.mysql.password }}',
            'options' => 2.0,
            'className' => '\\Bitrix\\Main\\DB\\MysqliConnection',
          ),
        ),
        'readonly' => true,
      ),
      'crypto' =>
      array (
        'value' =>
        array (
          'crypto_key' => '{{ uuidv4 | sha256sum | trunc 32 }}',
        ),
        'readonly' => true,
      ),
      'messenger' =>
      array (
        'value' =>
        array (
          'run_mode' => NULL,
          'brokers' =>
          array (
            'default' =>
            array (
              'type' => 'db',
              'params' =>
              array (
                'table' => 'Bitrix\\Main\\Messenger\\Internals\\Storage\\Db\\Model\\MessengerMessageTable',
              ),
            ),
          ),
          'queues' =>
          array (
          ),
        ),
        'readonly' => true,
      ),
    );
  dbconn.php: |-
    <?php
    $DBDebug = false;
    $DBDebugToFile = false;

    define("BX_FILE_PERMISSIONS", 0644);
    define("BX_DIR_PERMISSIONS", 0755);
    @umask(~(BX_FILE_PERMISSIONS | BX_DIR_PERMISSIONS) & 0777);

    define("BX_DISABLE_INDEX_PAGE", true);

    mb_internal_encoding("UTF-8");
    $_SERVER["SERVER_PORT"] = "443";

    @set_time_limit(php_sapi_name() == "cli" ? 600 : 60);

    if(!(defined("CHK_EVENT") && CHK_EVENT===true))
    	define("BX_CRONTAB_SUPPORT", true);
    define("BX_TEMPORARY_FILES_DIRECTORY", "/home/.bx_temp");

  .settings_extra.php: |-
    <?php
    return array(
        'session' => array(
            'value' => array(
                'mode' => 'default',
                'handlers' => array(
                    'general' => array(
                        'type' => 'redis',
                        'port' => 6379,
                        'host' => '{{ .Release.Name }}-redis-master',
                        'serializer' => Redis::SERIALIZER_IGBINARY,
                        'persistent' => false,
                        'failover' => RedisCluster::FAILOVER_DISTRIBUTE,
                        'timeout' => null,
                        'read_timeout' => null,
                    ),
                ),
            )
        ),
        {{- if or (include "bitrix.isProd" .) (include "bitrix.cacheEnabled" .) }}
        'cache' => array(
            'value' => array(
                'type' => array(
                    'class_name' => '\\Bitrix\\Main\\Data\\CacheEngineRedis',
                    'extension' => 'redis'
                ),
                'redis' => array(
                    'host' => '{{ .Release.Name }}-redis-master',
                    'port' => '6379',
                ),
                'sid' => $_SERVER["DOCUMENT_ROOT"]."#01"
            ),
        ),
        {{- end }}
        'composer' => [
          'value' => [
            'config_path' => '/home/bitrix/www/bitrix/composer-bx.json'
          ]
        ]
    );
    ?>
  after_connect_d7.php: |-
    <?php
    $this->queryExecute("SET SESSION sql_mode=''");
    $this->queryExecute("SET NAMES 'utf8mb4' COLLATE 'utf8mb4_0900_ai_ci'");
kind: Secret
type: Opaque
metadata:
  name: {{ printf "%s-configs" (include "bitrix.fullname" .) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bitrix.labels" . | nindent 4 }}