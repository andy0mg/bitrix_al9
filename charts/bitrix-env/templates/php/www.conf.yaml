apiVersion: v1
data:
  www.conf: |
    [global]
    pid = /run/php-fpm.pid
    error_log = /proc/self/fd/2
    process_control_timeout = 30
    daemonize = no
    [www]
    user = bitrix
    group = bitrix
    access.log = /dev/null
    catch_workers_output = yes
    decorate_workers_output = no
    clear_env = no
    listen = 127.0.0.1:9000
    listen.owner = bitrix
    listen.group = bitrix
    pm = dynamic
    pm.max_children = 80
    pm.start_servers = 16
    pm.min_spare_servers = 16
    pm.max_spare_servers = 16
    pm.max_requests = 500
    pm.status_path = /status
    ping.path = /ping
    php_admin_value[error_log] = /proc/self/fd/2
    php_admin_value[log_errors] = on
kind: ConfigMap
metadata:
  name: {{ printf "%s-www.conf" (include "bitrix.fullname" .) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bitrix.labels" . | nindent 4 }}