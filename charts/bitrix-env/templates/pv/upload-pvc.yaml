apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ printf "%s-upload-pvc" (include "bitrix.fullname" .) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bitrix.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: {{ .Values.s3.upload.capacity }}
  storageClassName: ""
   