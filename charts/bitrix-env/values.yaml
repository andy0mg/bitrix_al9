## Scheduling for cron deployments
## https://kubernetes.io/docs/concepts/scheduling-eviction/
cronSchedulling:
    enabled: false
    nodeAffinity: {}
    podAffinity: {}
    podAntiAffinity: {}
    nodeSelector: {}
    tolerations: []
## Scheduling for push deployments
