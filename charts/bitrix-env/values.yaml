    #   nodeSelectorTerms:
    #   - matchExpressions:
    #     - key: for
    #       operator: In
    #       values:
    #       - admin

    podAffinity: {}
    # preferredDuringSchedulingIgnoredDuringExecution:
    # - weight: 100
    #   podAffinityTerm:
    #     labelSelector:
    #       matchLabels:
    #         app.kubernetes.io/name: redis
    #         app.kubernetes.io/instance: "{{ .Release.Name }}"
