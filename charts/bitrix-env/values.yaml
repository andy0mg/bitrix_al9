php:
    registry: cr.yandex/yc-marketplace
    repository: yandex-cloud/bitrix-env/bitrix/bitrix-admin-php177566012908774532717748494070416466866550529540917756601290877453271774849407041646686655052954091775660129087745327177484940704164668665505295409
    tag: "8.2.30"
    tag8230: "8.2.30"
    tag8330: "8.3.30"
    tag8419: "8.4.19"
    defaultTag: "8.2.30"
    resources:
        # limits:
        #   cpu: 4000m
        #   memory: 4Gi
        requests:
            cpu: 500m
            memory: 500Mi
## @param push.key Secret push key, get it with docker:
## docker container run --rm --name push_server_key_generate alpine:3.21 sh -c "(cat /dev/urandom | tr -dc A-Za-z0-9 | head -c 128) && echo ''"  
push:
    replicaCount: !!float 1
    registry: cr.yandex/yc-marketplace
    repository: yandex-cloud/bitrix-env/bitrix/bitrix-push-server1775660129087745327177484940704164668665505295409
    tag: "3.2-v1"
    key: "somesecretkey"
    resources: {}
sphinx:
    replicaCount: !!float 1
    registry: cr.yandex/yc-marketplace
    repository: yandex-cloud/bitrix-env/bitrix/bitrix-sphinx1775660129087745327177484940704164668665505295409
    tag: "2.2.11-v2"
    resources: {}
phpExporter:
    registry: cr.yandex/yc-marketplace
    repository: yandex-cloud/bitrix-env/hipages/php-fpm_exporter1775660129087745327177484940704164668665505295409
    tag: "2.2.0"
    resources: {}
nginxExporter:
    registry: cr.yandex/yc-marketplace
    repository: yandex-cloud/bitrix-env/nginx/nginx-prometheus-exporter1775660129087745327177484940704164668665505295409
    tag: "1.5.1"
    resources: {}
kubelet:
    registry: cr.yandex/yc-marketplace
    repository: yandex-cloud/bitrix-env/bitnami/kubectl1775660129087745327177484940704164668665505295409
    tag: "1.35.3"
##  https://yandex.cloud/ru/docs/managed-kubernetes/operations/applications/cert-manager-cloud-dns
##  https://letsencrypt.org/ru/docs/challenge-types/#проверка-dns-01
##  DNS-01 is used to pass the check. Yandex Cloud DNS is used to pass the check.
##  Make sure that the Managed Service for Kubernetes cluster is located in the same folder as 
##  the public Cloud DNS zone.
certmanager:
    enabled: true
    issuer: "yc-clusterissuer"
    email: "user@example.ru"
##  @param tls.existingSecret Use secret with own certificate data
##  @param tls.certificate Use to set the own certificate. You must disable the use of certmanager
##  and don't use `existingSecret`
##  @param tls.privateKey Use the to set the own certificate. You must disable the use of certmanager
##  and don't use `existingSecret`
tls:
    existingSecret: ""
    certificate: ""
    # certificate: |
    #   -----BEGIN CERTIFICATE-----
    #   MIIFaz...
    #   -----END CERTIFICATE-----
    privateKey: ""
    # privateKey: |
    #   -----BEGIN PRIVATE KEY-----
    #   MIIEvw...
    #   -----END PRIVATE KEY-----
